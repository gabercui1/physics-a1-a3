<svg xmlns="http://www.w3.org/2000/svg" width="720" height="385" viewBox="0 0 720 385" role="img" aria-labelledby="title desc"><title id="title">Fixed resistor and NTC thermistor across a 9 V supply</title><desc id="desc">A fixed 3.0 kilohm top resistor is connected to plus 9 V. An NTC thermistor is the lower resistor and connects the output junction to 0 V. Warming the thermistor from 6.0 to 1.5 kilohms lowers Vout from 6.0 to 3.0 V.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#172128" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="385" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="36" text-anchor="start" font-size="23" font-weight="700" fill="#172128">A temperature-sensing potential divider</text><line x1="100.00" y1="86.00" x2="200.00" y2="86.00" stroke="#172128" stroke-width="2.5"/><line x1="200.00" y1="86.00" x2="200.00" y2="111.00" stroke="#172128" stroke-width="2.5"/><rect x="188" y="111" width="24" height="50" rx="0" fill="white" stroke="#172128" stroke-width="2.5"/><line x1="200.00" y1="161.00" x2="200.00" y2="228.00" stroke="#172128" stroke-width="2.5"/><rect x="188" y="228" width="24" height="50" rx="0" fill="white" stroke="#172128" stroke-width="2.5"/><path d="M178 286H187L223 217" stroke="#172128" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="200.00" y1="278.00" x2="200.00" y2="316.00" stroke="#172128" stroke-width="2.5"/><line x1="100.00" y1="316.00" x2="284.00" y2="316.00" stroke="#172128" stroke-width="2.5"/><line x1="200.00" y1="195.00" x2="284.00" y2="195.00" stroke="#172128" stroke-width="2.5"/><circle cx="200.00" cy="195.00" r="4" stroke="#172128" stroke-width="1" fill="#172128"/><text x="75" y="91" text-anchor="middle" font-size="17" font-weight="700" fill="#172128">+9 V</text><text x="68" y="321" text-anchor="middle" font-size="17" font-weight="700" fill="#172128">0 V</text><text x="237" y="141" text-anchor="start" font-size="17" font-weight="400" fill="#172128">3.0 kΩ</text><text x="238" y="258" text-anchor="start" font-size="16" font-weight="700" fill="#172128">NTC</text><circle cx="290.00" cy="195.00" r="5" stroke="#172128" stroke-width="2.5" fill="white"/><circle cx="290.00" cy="316.00" r="5" stroke="#172128" stroke-width="2.5" fill="white"/><text x="311" y="201" text-anchor="start" font-size="17" font-weight="700" fill="#172128">Vout</text><text x="311" y="321" text-anchor="start" font-size="16" font-weight="400" fill="#172128">0 V</text><line x1="378.00" y1="82.00" x2="378.00" y2="319.00" stroke="#d6dce0" stroke-width="1"/><text x="404" y="112" text-anchor="start" font-size="18" font-weight="700" fill="#172128">Cooler thermistor</text><text x="404" y="142" text-anchor="start" font-size="18" font-weight="400" fill="#172128">R = 6.0 kΩ</text><text x="404" y="171" text-anchor="start" font-size="18" font-weight="400" fill="#172128">Vout = 6.0 V</text><text x="404" y="226" text-anchor="start" font-size="18" font-weight="700" fill="#172128">Warmer thermistor</text><text x="404" y="256" text-anchor="start" font-size="18" font-weight="400" fill="#172128">R = 1.5 kΩ</text><text x="404" y="285" text-anchor="start" font-size="18" font-weight="400" fill="#172128">Vout = 3.0 V</text><text x="30" y="365" text-anchor="start" font-size="16" font-weight="400" fill="#172128">Output is measured from the junction to 0 V with negligible load current.</text></g></svg>