<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-labelledby="title desc"><title id="title">Terminal voltage plotted against current</title><desc id="desc">A straight line falls from 6.0 V at zero current through points 0.50 A and 5.5 V, and 1.50 A and 4.5 V. The slope is minus one ohm and the intercept is the emf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#172128" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="392" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="36" text-anchor="start" font-size="23" font-weight="700" fill="#172128">Finding internal resistance from a V–I graph</text><line x1="86.00" y1="306.00" x2="568.16" y2="306.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="311" text-anchor="end" font-size="14" font-weight="400" fill="#172128">0</text><line x1="86.00" y1="274.00" x2="568.16" y2="274.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="279" text-anchor="end" font-size="14" font-weight="400" fill="#172128">1</text><line x1="86.00" y1="242.00" x2="568.16" y2="242.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="247" text-anchor="end" font-size="14" font-weight="400" fill="#172128">2</text><line x1="86.00" y1="210.00" x2="568.16" y2="210.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="215" text-anchor="end" font-size="14" font-weight="400" fill="#172128">3</text><line x1="86.00" y1="178.00" x2="568.16" y2="178.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="183" text-anchor="end" font-size="14" font-weight="400" fill="#172128">4</text><line x1="86.00" y1="146.00" x2="568.16" y2="146.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="151" text-anchor="end" font-size="14" font-weight="400" fill="#172128">5</text><line x1="86.00" y1="114.00" x2="568.16" y2="114.00" stroke="#dce1e3" stroke-width="1"/><text x="75" y="119" text-anchor="end" font-size="14" font-weight="400" fill="#172128">6</text><line x1="184.00" y1="306.00" x2="184.00" y2="82.00" stroke="#dce1e3" stroke-width="1"/><text x="184.0" y="326" text-anchor="middle" font-size="14" font-weight="400" fill="#172128">0.5</text><line x1="282.00" y1="306.00" x2="282.00" y2="82.00" stroke="#dce1e3" stroke-width="1"/><text x="282" y="326" text-anchor="middle" font-size="14" font-weight="400" fill="#172128">1</text><line x1="380.00" y1="306.00" x2="380.00" y2="82.00" stroke="#dce1e3" stroke-width="1"/><text x="380.0" y="326" text-anchor="middle" font-size="14" font-weight="400" fill="#172128">1.5</text><line x1="478.00" y1="306.00" x2="478.00" y2="82.00" stroke="#dce1e3" stroke-width="1"/><text x="478" y="326" text-anchor="middle" font-size="14" font-weight="400" fill="#172128">2</text><line x1="86.00" y1="306.00" x2="576.00" y2="306.00" stroke="#172128" stroke-width="2" marker-end="url(#arrow)"/><line x1="86.00" y1="306.00" x2="86.00" y2="78.80" stroke="#172128" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="65" text-anchor="start" font-size="16" font-weight="600" fill="#172128">Terminal V / V</text><text x="575" y="331" text-anchor="start" font-size="16" font-weight="600" fill="#172128">I / A</text><line x1="86.00" y1="114.00" x2="560.32" y2="191.44" stroke="#172128" stroke-width="3"/><circle cx="184.00" cy="130.00" r="4" stroke="#172128" stroke-width="1" fill="#172128"/><text x="192.0" y="118.0" text-anchor="start" font-size="14" font-weight="400" fill="#172128" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">(0.50 A, 5.5 V)</text><circle cx="380.00" cy="162.00" r="4" stroke="#172128" stroke-width="1" fill="#172128"/><text x="388.0" y="150.0" text-anchor="start" font-size="14" font-weight="400" fill="#172128" paint-order="stroke" stroke="white" stroke-width="5" stroke-linejoin="round">(1.50 A, 4.5 V)</text><text x="30" y="369" text-anchor="start" font-size="17" font-weight="400" fill="#172128">Intercept 6.0 V gives the emf. Gradient −1.0 V/A gives r = 1.0 Ω.</text></g></svg>