<svg xmlns="http://www.w3.org/2000/svg" width="720" height="349" viewBox="0 0 720 349" role="img" aria-labelledby="title desc"><title id="title">Uniform potentiometer and slider</title><desc id="desc">A uniform track has 0 V at its left end and 6.0 V at its right. The slider contacts a point one quarter of the way from the left and is therefore at 1.5 V with no load.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#172128" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="349" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="37" text-anchor="start" font-size="23" font-weight="700" fill="#172128">A potentiometer taps a uniform resistive track</text><line x1="95.00" y1="165.00" x2="165.00" y2="165.00" stroke="#172128" stroke-width="2.5"/><rect x="165" y="150" width="395" height="30" rx="0" fill="white" stroke="#172128" stroke-width="2.5"/><line x1="560.00" y1="165.00" x2="625.00" y2="165.00" stroke="#172128" stroke-width="2.5"/><circle cx="90.00" cy="165.00" r="5" stroke="#172128" stroke-width="2.5" fill="white"/><circle cx="630.00" cy="165.00" r="5" stroke="#172128" stroke-width="2.5" fill="white"/><text x="90" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#172128">0 V</text><text x="625" y="137" text-anchor="middle" font-size="18" font-weight="700" fill="#172128">6.0 V</text><line x1="265.00" y1="85.00" x2="265.00" y2="147.00" stroke="#172128" stroke-width="2.5" marker-end="url(#arrow)"/><text x="265" y="68" text-anchor="middle" font-size="17" font-weight="700" fill="#172128">Slider</text><line x1="165.00" y1="211.00" x2="264.00" y2="211.00" stroke="#172128" stroke-width="1.4"/><line x1="165.00" y1="204.00" x2="165.00" y2="218.00" stroke="#172128" stroke-width="1.4"/><line x1="264.00" y1="204.00" x2="264.00" y2="218.00" stroke="#172128" stroke-width="1.4"/><text x="214" y="242" text-anchor="middle" font-size="16" font-weight="400" fill="#172128">¼ of track</text><text x="30" y="293" text-anchor="start" font-size="18" font-weight="400" fill="#172128">At this setting, the slider is 1.5 V above the 0 V end.</text><text x="30" y="326" text-anchor="start" font-size="16" font-weight="400" fill="#172128">Moving it right increases the unloaded output. The full track stays at 6.0 V.</text></g></svg>