<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title desc"><title id="title">Ammeter in series and voltmeter in parallel</title><desc id="desc">A cell drives current through an ammeter and a lamp. A voltmeter is connected between the two ends of that lamp. The ideal voltmeter draws no current.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#172128" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="400" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="36" text-anchor="start" font-size="23" font-weight="700" fill="#172128">Measure the current and p.d. of a lamp</text><path d="M120.00,173.00 L120.00,99.00 L235.00,99.00" stroke="#172128" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="258.00" cy="99.00" r="23" stroke="#172128" stroke-width="2.5" fill="white"/><text x="258" y="105" text-anchor="middle" font-size="19" font-weight="700" fill="#172128">A</text><line x1="281.00" y1="99.00" x2="418.00" y2="99.00" stroke="#172128" stroke-width="2.5"/><line x1="120.00" y1="190.00" x2="120.00" y2="293.00" stroke="#172128" stroke-width="2.5"/><line x1="120.00" y1="293.00" x2="418.00" y2="293.00" stroke="#172128" stroke-width="2.5"/><line x1="97.00" y1="173.00" x2="143.00" y2="173.00" stroke="#172128" stroke-width="3"/><line x1="110.00" y1="190.00" x2="130.00" y2="190.00" stroke="#172128" stroke-width="4"/><text x="83" y="173" text-anchor="start" font-size="19" font-weight="400" fill="#172128">+</text><text x="83" y="195" text-anchor="start" font-size="19" font-weight="400" fill="#172128">−</text><line x1="418.00" y1="99.00" x2="418.00" y2="166.00" stroke="#172128" stroke-width="2.5"/><circle cx="418.00" cy="190.00" r="24" stroke="#172128" stroke-width="2.5" fill="white"/><line x1="401.68" y1="173.68" x2="434.32" y2="206.32" stroke="#172128" stroke-width="2"/><line x1="434.32" y1="173.68" x2="401.68" y2="206.32" stroke="#172128" stroke-width="2"/><line x1="418.00" y1="214.00" x2="418.00" y2="293.00" stroke="#172128" stroke-width="2.5"/><path d="M418.00,135.00 L571.00,135.00 L571.00,166.00" stroke="#172128" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="571.00" cy="190.00" r="24" stroke="#172128" stroke-width="2.5" fill="white"/><text x="571" y="196" text-anchor="middle" font-size="19" font-weight="700" fill="#172128">V</text><path d="M571.00,214.00 L571.00,250.00 L418.00,250.00" stroke="#172128" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="418.00" cy="135.00" r="4" stroke="#172128" stroke-width="1" fill="#172128"/><circle cx="418.00" cy="250.00" r="4" stroke="#172128" stroke-width="1" fill="#172128"/><line x1="307.00" y1="99.00" x2="352.00" y2="99.00" stroke="#172128" stroke-width="2" marker-end="url(#arrow)"/><text x="235" y="67" text-anchor="start" font-size="16" font-weight="600" fill="#172128">Series</text><text x="484" y="119" text-anchor="start" font-size="16" font-weight="600" fill="#172128">Parallel</text><text x="374" y="195" text-anchor="end" font-size="16" font-weight="400" fill="#172128">Lamp</text><text x="31" y="343" text-anchor="start" font-size="17" font-weight="400" fill="#172128">A lies on the lamp’s path. An ideal A adds zero resistance.</text><text x="31" y="374" text-anchor="start" font-size="17" font-weight="400" fill="#172128">V joins the lamp’s two terminals. An ideal V draws zero current.</text></g></svg>