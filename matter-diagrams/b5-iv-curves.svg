<svg xmlns="http://www.w3.org/2000/svg" width="720" height="363" viewBox="0 0 720 363" role="img" aria-labelledby="title desc"><title id="title">Current against potential difference for three components</title><desc id="desc">Each plot has current on the vertical axis, voltage on the horizontal axis, and positive and negative values. The fixed-temperature metal wire gives a straight line through zero. The filament curve flattens in both directions. The diode carries little reverse current and rises steeply in forward bias.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#172128" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="720" height="363" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="30" y="36" text-anchor="start" font-size="23" font-weight="700" fill="#172128">Three I–V characteristics</text><line x1="35.00" y1="199.00" x2="223.00" y2="199.00" stroke="#172128" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="128.00" y1="305.00" x2="128.00" y2="97.00" stroke="#172128" stroke-width="1.7" marker-end="url(#arrow)"/><text x="225" y="218" text-anchor="end" font-size="14" font-weight="400" fill="#172128">V</text><text x="119" y="98" text-anchor="end" font-size="14" font-weight="400" fill="#172128">I</text><text x="120" y="216" text-anchor="end" font-size="13" font-weight="400" fill="#172128">0</text><text x="128" y="71" text-anchor="middle" font-size="16" font-weight="600" fill="#172128">Metal wire at fixed T</text><line x1="268.00" y1="199.00" x2="456.00" y2="199.00" stroke="#172128" stroke-width="1.7" marker-end="url(#arrow)"/><line x1="361.00" y1="305.00" x2="361.00" y2="97.00" stroke="#172128" stroke-width="1.7" marker-end="url(#arrow)"/><text x="458" y="218" text-anchor="end" font-size="14" font-weight="400" fill="#172128">V</text><text x="352" y="98" text-anchor="