<title id="title">Black-body spectra at 5000 K and 6000 K</title><desc id="desc">Planck spectra on a common scale. The 6000 K spectrum peaks at 0.48 micrometres, to the left of the 5000 K peak at 0.58 micrometres. The hotter body emits more at every wavelength shown.</desc>
